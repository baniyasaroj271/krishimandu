{% extends "base.html" %}{% block content %}<form class="card form wide" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>{{ title }}</h2><p class="muted">Add accurate information so buyers can compare your listing.</p><div class="grid"><label>Product name<input name="name" required value="{{ product.name if product else '' }}"></label><label>Category<input name="category" required placeholder="Vegetables or Fruits" value="{{ product.category if product else '' }}"></label><label>Vegetable or fruit type<select name="produce_type" required><option value="">Select type</option>{% for type in ['Vegetable','Fruit'] %}<option {% if product and product.produce_type == type %}selected{% endif %}>{{ type }}</option>{% endfor %}</select></label><label>English name<input name="english_name" required value="{{ product.english_name if product else '' }}"></label><label>Nepali name<input name="nepali_name" value="{{ product.nepali_name if product else '' }}"></label><label>Variety<input name="variety" required value="{{ product.variety if product else '' }}"></label><label>Quality grade<select name="quality_grade" required>{% for grade in ['Premium','Grade A','Grade B','Standard'] %}<option {% if product and product.quality_grade == grade %}selected{% endif %}>{{ grade }}</option>{% endfor %}</select></label><label>Product image<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp" {% if not product %}required{% endif %}></label><label>Quantity<input type="number" name="stock_quantity" min="0" step="0.01" required value="{{ product.stock_quantity if product else '' }}"></label><label>Measurement unit<select name="unit" required>{% for unit in ['kg','quintal','crate'] %}<option {% if product and product.unit == unit %}selected{% endif %}>{{ unit }}</option>{% endfor %}</select></label><label>Price per unit (NPR)<input type="number" name="price_per_unit" min="0.01" step="0.01" required value="{{ product.price_per_unit if product else '' }}"></label><label>Minimum order quantity<input type="number" name="minimum_order_quantity" min="0.01" step="0.01" required value="{{ product.minimum_order_quantity if product else '1' }}"></label><label>Harvest date<input type="date" name="harvest_date" max="{{ today }}" required value="{{ product.harvest_date.isoformat() if product and product.harvest_date else '' }}"></label><label>Farm location<input name="farm_location" required value="{{ product.farm_location if product else '' }}"></label><label class="full">Description<textarea name="description" required>{{ product.description if product else '' }}</textarea></label></div><button class="primary">{{ "Update product" if product else "Add product" }}</button><a class="center" href="{{ url_for('dashboard.inventory') }}">Cancel</a></form>{% endblock %}
