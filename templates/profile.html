{% extends "base.html" %}{% block content %}<section class="two-col"><form class="card form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Manage profile</h2><p class="badge">{{ current_user.role|capitalize }}</p><label>Full name<input name="full_name" required value="{{ current_user.full_name }}"></label><label>Mobile number<input name="phone" required value="{{ current_user.phone }}"></label><label>Address<textarea name="address" required>{{ current_user.address }}</textarea></label><label>Profile picture<input type="file" name="profile_picture" accept=".png,.jpg,.jpeg,.webp"></label>{% if farmer %}<label>Farm name<input name="farm_name" value="{{ farmer.farm_name }}"></label><label>Farming location<input name="farming_location" value="{{ farmer.farming_location }}"></label><label>Product categories<input name="product_categories" value="{{ farmer.product_categories }}"></label>{% elif business %}<label>Business name<input name="business_name" value="{{ business.business_name }}"></label><label>Business type<input name="business_type" value="{{ business.business_type }}"></label><label>Purchase location<input name="purchase_location" value="{{ business.purchase_location }}"></label><label>Shop address<input name="shop_address" value="{{ business.shop_address or '' }}"></label>{% endif %}<button class="primary">Save changes</button></form><form class="card form" method="post" action="{{ url_for('profile.change_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Change password</h2><label>Current password<input type="password" name="current_password" required></label><label>New password<input type="password" name="new_password" minlength="8" required></label><label>Confirm new password<input type="password" name="confirm_password" minlength="8" required></label><button class="primary">Change password</button></form></section>{% endblock %}
