{% extends "base.html" %}{% block content %}
<section class="auth-layout"><div class="hero"><p class="eyebrow">Nepal's farm-to-market network</p><h1>Fresh harvests.<br><em>Fairer markets.</em></h1><p>Connect with trusted farmers and buyers across Nepal.</p></div>
<form class="card form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Welcome back</h2><p class="muted">Sign in to your KrishiDirect account.</p><label>Email or phone<input name="identifier" required autocomplete="username"></label><label>Password<div class="password"><input id="password" type="password" name="password" required autocomplete="current-password"><button type="button" data-toggle-password="#password">Show</button></div></label><div class="row-between"><label class="check"><input type="checkbox" name="remember"> Remember me</label><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></div><button class="primary" type="submit">Sign in</button><p class="center">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></form></section>
{% endblock %}
