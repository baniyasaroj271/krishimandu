{% extends "base.html" %}{% block content %}<form class="card form narrow" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Checkout</h2><p class="muted">Prices and stock are validated again before the order is saved.</p><label>Delivery address<textarea name="delivery_address" required>{{ current_user.address }}</textarea></label><label>Contact number<input name="contact_number" value="{{ current_user.phone }}" required></label><label>Payment method<select name="payment_method" required><option value="cash_on_delivery">Cash on delivery</option><option value="bank_transfer">Bank transfer</option></select></label><button class="primary">Place order</button></form>{% endblock %}
